<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
    <!-- Google Fonts: DM Sans (body) and Space Grotesk (heading) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <main>
      <h1>Introduction to JavaScript</h1>
      <section class="card">
        <h2>Calculator</h2>

        <div class="fields">
          <div class="field">
            <label for="num1">Number 1</label>
            <input type="number" id="num1" />
          </div>
          <div class="field">
            <label for="num2">Number 2</label>
            <input type="number" id="num2" />
          </div>
        </div>

        <div class="buttons">
          <button id="btnAdd">Add</button>
          <button id="btnSubtract">Subtract</button>
          <button id="btnMultiply">Multiply</button>
        </div>

        <div class="field">
          <label for="inputResult">Result</label>
          <input type="text" readonly value="" id="inputResult" />
        </div>
      </section>

      <section class="card">
        <h2>Superhero API</h2>
        <div class="search">
          <input
            type="text"
            id="txtSearchHero"
            placeholder="Search a hero, e.g. Batman"
            aria-label="Hero name"
          />
          <button id="btnSearchHero">Search</button>
        </div>
        <p id="searchMessage" class="message" aria-live="polite"></p>
        <div id="heroResults" class="hero-results"></div>
      </section>
    </main>
  </body>
</html>
